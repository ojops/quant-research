[project]
name = "quant-research"
version = "0.1.0"
description = "Reproducible single-asset return analysis and cost-aware backtesting"
readme = "README.md"
authors = [
    { name = "ojops", email = "ojop1@outlook.com" }
]
requires-python = "==3.10.*"
dependencies = []

[project.scripts]
quant-research = "quant_research.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff==0.14.3"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
